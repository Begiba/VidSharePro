<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VidSharePro | Enterprise Video</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:,">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

</head>
<body>
    <nav>
        <div class="brand">VidSharePro</div>
        <div id="nav-user" style="display:none;">
            <span id="username-display"></span>
            <button id="btn-logout">Logout</button>
        </div>
    </nav>

    <div class="container">
        <section id="sec-login">
            <h2>Login</h2>
            <form id="form-login">
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-pass" placeholder="Password" required>
                <button type="submit">Sign In</button>
            </form>
        </section>

        <section id="sec-dashboard" style="display:none;">
            <div class="actions">
                <button id="btn-show-upload">Upload New Video</button>
            </div>

            <h3>My Videos</h3>
            <div id="video-list" class="video-grid">
            </div>
        </section>

        <div id="modal-upload" class="modal" style="display:none;">
            <div class="modal-content">
                <h3>Upload Video</h3>
                <input type="text" id="up-title" placeholder="Video Title">
                <input type="file" id="up-file" accept="video/mp4,video/webm">

                <div class="progress-wrapper" style="display:none;">
                    <div id="progress-bar"></div>
                    <span id="progress-percent">0%</span>
                </div>

                <button id="btn-do-upload">Start Upload</button>
                <button class="btn-close">Cancel</button>
            </div>
        </div>

        <section id="sec-player" style="display:none;">
            <button id="btn-back">← Back</button>
            <h2 id="playing-title"></h2>
            <video id="main-video-player" controls controlsList="nodownload">
                Your browser does not support the video tag.
            </video>
        </section>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
